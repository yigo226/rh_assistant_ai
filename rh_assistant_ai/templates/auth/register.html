{% extends "squelette/base.html" %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      
      <div class="match-card p-4 shadow-sm">
        
        <!-- En-tête du formulaire -->
        <div class="text-center mb-4">
          <span class="match-card-icon match-card-icon--purple mb-3 d-inline-flex align-items-center justify-content-center" style="width: 60px; height: 60px; font-size: 1.5rem;">
            <i class="ti ti-user-plus"></i>
          </span>
          <h2 class="mt-2">Créer un compte</h2>
          <p class="text-muted small">Rejoignez la plateforme pour analyser vos CV et offres d'emploi</p>
        </div>

        <!-- Formulaire d'inscription -->
        <form method="POST" id="registerForm" autocomplete="on">
          
          <!-- Ligne Nom & Prénom -->
          <div class="row">
            <!-- Champ Nom -->
            <div class="col-md-6 mb-3">
              <label class="form-label font-weight-bold small text-secondary" for="nomInput">
                Nom
              </label>
              <div class="input-group">
                <span class="input-group-text bg-light border-right-0">
                  <i class="ti ti-user text-muted"></i>
                </span>
                <input
                  type="text"
                  name="nom"
                  id="nomInput"
                  class="form-control border-left-0"
                  placeholder="YIGO"
                  required
                >
              </div>
            </div>

            <!-- Champ Prénom -->
            <div class="col-md-6 mb-3">
              <label class="form-label font-weight-bold small text-secondary" for="prenomInput">
                Prénom
              </label>
              <div class="input-group">
                <span class="input-group-text bg-light border-right-0">
                  <i class="ti ti-user text-muted"></i>
                </span>
                <input
                  type="text"
                  name="prenom"
                  id="prenomInput"
                  class="form-control border-left-0"
                  placeholder="Nourou"
                  required
                >
              </div>
            </div>
          </div>

          <!-- Champ Email -->
          <div class="mb-3">
            <label class="form-label font-weight-bold small text-secondary" for="emailInput">
              Adresse e-mail
            </label>
            <div class="input-group">
              <span class="input-group-text bg-light border-right-0">
                <i class="ti ti-mail text-muted"></i>
              </span>
              <input
                type="email"
                name="email"
                id="emailInput"
                class="form-control border-left-0"
                placeholder="exemple@email.com"
                required
              >
            </div>
          </div>

          <!-- Champ Mot de passe -->
          <div class="mb-4">
            <label class="form-label font-weight-bold small text-secondary" for="passwordInput">
              Mot de passe
            </label>
            <div class="input-group">
              <span class="input-group-text bg-light border-right-0">
                <i class="ti ti-key text-muted"></i>
              </span>
              <input
                type="password"
                name="password"
                id="passwordInput"
                class="form-control border-left-0"
                placeholder="••••••••"
                required
              >
            </div>
          </div>

          <!-- Bouton de soumission global -->
          <button type="submit" class="match-submit-btn w-100 d-flex align-items-center justify-content-center gap-2 mb-3" id="registerSubmitBtn">
            <i class="ti ti-user-check"></i>
            S'inscrire
          </button>

          <!-- ============================================================
               LIENS DE REDIRECTION (Déjà un compte / Mot de passe oublié)
               ============================================================ -->
          <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 mt-3 pt-2 border-top">
            <span class="small text-muted">
              Déjà inscrit ? 
              <a href="login" class="text-primary font-weight-bold text-decoration-none">
                <i class="ti ti-login"></i> Se connecter
              </a>
            </span>
            <a href="forgot_password" class="small text-secondary text-decoration-none">
              <i class="ti ti-help"></i> Mot de passe oublié ?
            </a>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
{% endblock %}
