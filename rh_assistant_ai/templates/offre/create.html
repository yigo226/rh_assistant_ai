{% extends "squelette/base.html" %}

{% block content %}

<div class="container">

    <h2>Nouvelle offre</h2>

    <form method="POST">

        <input
            type="text"
            name="titre"
            class="form-control mb-3"
            placeholder="Titre du poste"
        >

        <textarea
            name="description"
            rows="10"
            class="form-control"
            placeholder="Description du poste"
        ></textarea>

        <button
            class="btn btn-primary mt-3"
            type="submit"
        >
            Analyser
        </button>

    </form>

</div>

{% endblock %}
