<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}rh_assistant — Assistant RH intelligent{% endblock %}</title>

  <!-- Bootstrap 5.3 -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous" />

  <!-- Tabler Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/matching.css') }}">

  <!-- Styles propres -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>

<body>
  <div class="app-wrapper">

    <!-- Header -->
    <header class="app-header">
      <div class="header-inner">
        <span class="header-dot"></span>
        <span class="header-title">rh_assistant</span>
        <span class="header-badge">IA active</span>
      </div>
      <button class="sidebar-toggle d-md-none" id="sidebarToggle" aria-label="Ouvrir le menu">
        <i class="ti ti-menu-2"></i>
      </button>
    </header>

    <!-- Corps -->
    <div class="app-body">
      
      <!-- Navbar latérale -->
      <div id="navbar-placeholder">
        {% include 'squelette/nav.html' %}
      </div>

      <!-- Zone principale -->
      <main class="chat-wrapper" id="chatWrapper">
        {% block content %}
        
        {% endblock %}
      </main>
    </div>

    <!-- Footer -->
    <div id="footer-placeholder">
      {% include 'squelette/footer.html' %}
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmCt4bRa89Rz6htAHVtASopFIbNH"
          crossorigin="anonymous"></script>

  <!-- Script applicatif -->
  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script src="{{ url_for('static', filename='js/uploadScript.js') }}"></script>
  <script src="{{ url_for('static', filename='js/matchingScript.js') }}"></script>

</body>
</html>
