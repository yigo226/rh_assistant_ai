{% extends "squelette/base.html" %}

{% block title %}Accueil — Assistant RH{% endblock %}

{% block content %}
  <div class="chat-messages" id="chatMessages">
    <div class="msg msg-bot">
      <div class="msg-avatar avatar-bot">AI</div>
      <div class="msg-content">
        <div class="msg-bubble">
          Bonjour ! Je suis votre assistant RH. Sélectionnez une action
          dans le menu ou posez-moi directement votre question.
        </div>
      </div>
    </div>
  </div>

  <div class="chat-input-bar">
    <label for="msgInput" class="visually-hidden">Votre message</label>
    <input type="text" id="msgInput" class="chat-input"
           placeholder="Posez votre question ou collez un texte…" autocomplete="off" />
    <button class="send-btn" id="sendBtn" aria-label="Envoyer le message">
      <i class="ti ti-arrow-up"></i>
    </button>
  </div>
{% endblock %}
